name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
    name: Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract
        run: |
          VERSION_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -n 1)
          if [ -z "$VERSION_LINE" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*## \[([^]]+)\].*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.extract.outputs.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check_tag.outputs.exists == 'false'

      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: "@angelmunoz"

      - uses: actions/setup-dotnet@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          dotnet-version: "10.0.x"

      - run: pnpm install --frozen-lockfile
        if: steps.check_tag.outputs.exists == 'false'

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        if: steps.check_tag.outputs.exists == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=briple
