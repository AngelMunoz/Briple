<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Briple</title>
    <meta
      name="description"
      content="Import a training plan file and browse it as a calendar. Everything runs on the device; no account or server is involved."
    />
    <meta name="theme-color" content="#0078d4" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      href="/pwa-64x64-light.png"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/pwa-64x64.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180-light.png"
      sizes="180x180"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      sizes="180x180"
      media="(prefers-color-scheme: dark)"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #root {
        height: 100%;
      }
      /* metrino's metro-button hard-codes min-width: 120px for text labels;
         the day-hub chevrons need compact controls, so they use plain
         buttons styled with the metrino tokens. */
      .day-chevron {
        min-width: 32px;
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        color: var(--metro-foreground);
        border: none;
        cursor: pointer;
      }
      .day-chevron:hover {
        background: var(--metro-highlight-hover);
      }
      /* Week pivot rows: plain tap rows; the today row carries
         the accent bar and a quiet highlight. */
      .week-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        margin: 0 16px;
        padding: 8px;
        background: transparent;
        color: var(--metro-foreground);
        border: none;
        cursor: pointer;
        font-family: var(--metro-font-family);
        text-align: left;
        transition: background var(--metro-transition-fast) var(--metro-easing);
      }
      .week-row:hover {
        background: var(--metro-highlight-hover);
      }
      .week-row.today {
        box-shadow: inset 3px 0 0 var(--metro-accent);
        background: var(--metro-highlight, rgba(128, 128, 128, 0.12));
      }
      /* Day hub: one day per section. A section spans most of the container
         so the next day peeks at the edge, and the selected section's
         header takes the accent through the part attributes that
         metrino 0.5 emits. */
      metro-hub-section {
        flex: 0 0 85%;
        max-width: 360px;
      }
      metro-hub-section::part(section-content) {
        padding-inline: 0;
      }
      metro-hub-section[selected]::part(section-header) {
        color: var(--metro-accent);
      }
      /* Settings: the accent swatch grid. Swatches are plain buttons (the
         library has no swatch surface), one tile per Metro accent; the
         selected tile gains a foreground outline like the metrino demo's
         picker. */
      .accent-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        max-width: 340px;
      }
      .accent-swatch {
        width: 100%;
        aspect-ratio: 1;
        min-width: 0;
        padding: 0;
        border: none;
        cursor: pointer;
        transition: transform var(--metro-transition-fast) var(--metro-easing);
      }
      .accent-swatch:hover {
        transform: scale(1.08);
      }
      .accent-swatch.selected {
        outline: 2px solid var(--metro-foreground);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/Program.fs.js"></script>
  </body>
</html>
