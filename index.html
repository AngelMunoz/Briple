<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyApp</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #root {
        height: 100%;
      }
      /* metrino's metro-button hard-codes min-width: 120px for text labels;
         the day-hub chevrons need compact controls, so they use plain
         buttons styled with the metrino tokens. */
      .day-chevron {
        min-width: 32px;
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        color: var(--metro-foreground);
        border: none;
        cursor: pointer;
      }
      .day-chevron:hover {
        background: var(--metro-highlight-hover);
      }
      /* Day hub: one day per section. A section spans most of the container
         so the next day peeks at the edge, and the selected section's
         header takes the accent through the part attributes that
         metrino 0.5 emits. */
      metro-hub-section {
        flex: 0 0 85%;
        max-width: 360px;
      }
      metro-hub-section::part(section-content) {
        padding-inline: 0;
      }
      metro-hub-section[selected]::part(section-header) {
        color: var(--metro-accent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/Program.fs.js"></script>
  </body>
</html>
