<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Briple browser tests</title>
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script type="module">
      // QUnit adopts this config at load time instead of auto-starting on an
      // empty registry (same trick as Mibo.Fable's harness).
      globalThis.QUnit = { config: { autostart: false } };

      const { QUnit } = await import("qunit");

      window.__failures = [];
      QUnit.on("testEnd", (test) => {
        if (test.status !== "failed") {
          return;
        }
        const messages = test.assertions
          .filter((a) => !a.passed)
          .map((a) => a.message);
        window.__failures.push({ name: test.fullName, messages });
      });
      QUnit.on("runEnd", (details) => {
        window.__runEnd = {
          status: details.status,
          counts: details.testCounts,
          runtime: details.runtime,
          failures: window.__failures,
        };
        document.title = "RUN_END " + details.status;
      });

      const modules = import.meta.glob("./*Tests.fs.js");
      for (const path of Object.keys(modules).sort()) {
        try {
          await modules[path]();
        } catch (err) {
          window.__failures.push({
            name: path,
            messages: ["failed to import: " + (err?.message ?? err)],
          });
        }
      }
      QUnit.start();
    </script>
  </body>
</html>
